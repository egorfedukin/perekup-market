<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Восстановление доступа — Рынок.</title><link rel="stylesheet" href="styles.css"></head><body class="auth-page"><main class="auth-card"><a class="legal-brand" href="/">РЫНОК<span>.</span></a><p class="eyebrow">Восстановление аккаунта</p><h1>Новый пароль</h1><p class="auth-lead">Придумайте новый пароль для входа в игру.</p><form id="reset-form" class="reset-form"><label for="password">Новый пароль<input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required placeholder="Например, Market_2026!"></label><label for="password-confirm">Повторите пароль<input id="password-confirm" type="password" minlength="8" maxlength="72" autocomplete="new-password" required placeholder="Повторите новый пароль"></label><p class="password-rule">Только английские буквы, цифры и спецсимволы. От 8 до 72 знаков.</p><button type="submit">Сохранить новый пароль <span aria-hidden="true">→</span></button><p id="message" class="form-error" role="alert"></p></form><p class="legal-actions"><a href="/">Вернуться ко входу</a></p></main><script>document.getElementById('reset-form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message'),p=document.getElementById('password').value,c=document.getElementById('password-confirm').value;if(!/^[A-Za-z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>/?`~]{8,72}$/.test(p)){m.textContent='Используйте только английские буквы, цифры и спецсимволы.';return}if(p!==c){m.textContent='Пароли не совпадают.';return}try{const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token'),password:p})});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');m.className='form-success';m.textContent='Пароль изменён. Теперь можно войти.';e.target.hidden=true}catch(x){m.textContent=x.message}});</script></body></html>
