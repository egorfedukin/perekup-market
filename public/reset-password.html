<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новый пароль — Рынок.</title><link rel="stylesheet" href="styles.css"></head><body class="legal-page"><main><a class="legal-brand" href="/">РЫНОК<span>.</span></a><h1>Новый пароль</h1><form id="reset-form"><label>Новый пароль<input id="password" type="password" minlength="8" maxlength="72" required placeholder="Не менее 8 символов"></label><button type="submit">Сохранить пароль</button><p id="message" class="form-error"></p></form><p class="legal-actions"><a href="/">Вернуться ко входу</a></p></main><script>document.getElementById('reset-form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message');try{const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token'),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');m.textContent='Пароль изменён. Теперь можно войти.';e.target.hidden=true}catch(x){m.textContent=x.message}});</script></body></html>
