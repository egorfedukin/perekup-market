<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подтверждение email — Рынок.</title><link rel="stylesheet" href="styles.css"></head><body class="legal-page"><main><a class="legal-brand" href="/">РЫНОК<span>.</span></a><h1 id="verify-title">Подтверждаем email</h1><p id="verify-text">Проверяем ссылку подтверждения...</p><p class="legal-actions"><a href="/">Вернуться к входу</a></p></main><script>const text=document.getElementById('verify-text'),title=document.getElementById('verify-title');fetch('/api/verify-email'+location.search).then(r=>r.json().then(data=>({ok:r.ok,data}))).then(({ok,data})=>{if(ok&&data.token){localStorage.setItem('perekup-token',data.token);title.textContent='Email подтверждён';text.textContent='Аккаунт подтверждён. Открываем игру…';setTimeout(()=>{location.href='/#profile'},500)}else{title.textContent='Ссылка недействительна';text.textContent='Ссылка устарела или уже использована.'}}).catch(()=>{title.textContent='Ошибка';text.textContent='Не удалось проверить ссылку.'});</script></body></html>
